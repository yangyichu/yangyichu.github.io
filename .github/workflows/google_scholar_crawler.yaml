name: Update Google Scholar citation data

on:
  workflow_dispatch:
  push:
    branches:
      - academic
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"
  schedule:
    - cron: "17 8 * * *"

env:
  GOOGLE_SCHOLAR_ID: A_oWM24AAAAJ

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: academic

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        working-directory: google_scholar_crawler
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python main.py

      - name: Publish citation data branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: google_scholar_crawler/results
          publish_branch: google-scholar-stats
          force_orphan: true
          commit_message: "Update Google Scholar citation data"
