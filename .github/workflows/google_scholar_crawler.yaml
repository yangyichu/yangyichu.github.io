name: Update Google Scholar citation data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-crawler
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Validate Google Scholar profile ID
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          if [ -z "$GOOGLE_SCHOLAR_ID" ]; then
            echo "Add GOOGLE_SCHOLAR_ID as a repository Actions secret." >&2
            exit 2
          fi

      - name: Fetch citation data
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python main.py

      - name: Publish citation data branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: google_scholar_crawler/results
          publish_branch: google-scholar-stats
          force_orphan: true
          commit_message: "Update Google Scholar citation data"
