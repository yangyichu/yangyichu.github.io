<script>
    function renderScholarCitationChart(container, citesPerYear) {
        if (!container) return;

        var points = Object.keys(citesPerYear || {}).map(function (year) {
            return { year: Number(year), citations: Number(citesPerYear[year]) || 0 };
        }).filter(function (point) {
            return Number.isFinite(point.year);
        }).sort(function (a, b) {
            return a.year - b.year;
        });

        if (!points.length) {
            container.textContent = 'Citation history will appear after the first successful sync.';
            return;
        }

        var ns = 'http://www.w3.org/2000/svg';
        var width = 620;
        var height = 170;
        var padding = { top: 16, right: 18, bottom: 30, left: 38 };
        var plotWidth = width - padding.left - padding.right;
        var plotHeight = height - padding.top - padding.bottom;
        var maxCitations = Math.max.apply(null, points.map(function (point) {
            return point.citations;
        }).concat([1]));

        function x(index) {
            return padding.left + (points.length === 1 ? plotWidth / 2 : index * plotWidth / (points.length - 1));
        }

        function y(value) {
            return padding.top + plotHeight - value * plotHeight / maxCitations;
        }

        var svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
        svg.setAttribute('aria-hidden', 'true');

        [0, 0.5, 1].forEach(function (fraction) {
            var grid = document.createElementNS(ns, 'line');
            var gridY = y(maxCitations * fraction);
            grid.setAttribute('x1', padding.left);
            grid.setAttribute('x2', width - padding.right);
            grid.setAttribute('y1', gridY);
            grid.setAttribute('y2', gridY);
            grid.setAttribute('class', 'scholar-chart__grid');
            svg.appendChild(grid);
        });

        var area = document.createElementNS(ns, 'polygon');
        var linePoints = points.map(function (point, index) {
            return x(index) + ',' + y(point.citations);
        });
        area.setAttribute('points', [padding.left + ',' + y(0)].concat(linePoints).concat([(width - padding.right) + ',' + y(0)]).join(' '));
        area.setAttribute('class', 'scholar-chart__area');
        svg.appendChild(area);

        var line = document.createElementNS(ns, 'polyline');
        line.setAttribute('points', linePoints.join(' '));
        line.setAttribute('class', 'scholar-chart__line');
        svg.appendChild(line);

        points.forEach(function (point, index) {
            var circle = document.createElementNS(ns, 'circle');
            circle.setAttribute('cx', x(index));
            circle.setAttribute('cy', y(point.citations));
            circle.setAttribute('r', 4);
            circle.setAttribute('class', 'scholar-chart__point');
            var title = document.createElementNS(ns, 'title');
            title.textContent = point.year + ': ' + point.citations + ' citations';
            circle.appendChild(title);
            svg.appendChild(circle);

            if (points.length <= 8 || index === 0 || index === points.length - 1 || index % 2 === 0) {
                var label = document.createElementNS(ns, 'text');
                label.setAttribute('x', x(index));
                label.setAttribute('y', height - 9);
                label.setAttribute('class', 'scholar-chart__label');
                label.textContent = point.year;
                svg.appendChild(label);
            }
        });

        container.innerHTML = '';
        container.appendChild(svg);
    }

    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/';
        {% endif %}
        var dataUrl = gsDataBaseUrl + 'google-scholar-stats/gs_data.json?ts=' + Date.now();

        $.getJSON(dataUrl, function (data) {
            var totalCitation = Number(data['citedby']) || 0;
            var totalCitationElement = document.getElementById('total_cit');
            if (totalCitationElement) totalCitationElement.textContent = totalCitation.toLocaleString();

            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data');
                var publication = data['publications'] && data['publications'][paperId];
                if (!publication && data['publications']) {
                    var expectedTitle = (element.getAttribute('data-title') || '').trim().toLowerCase();
                    publication = Object.values(data['publications']).find(function (candidate) {
                        var candidateTitle = candidate && candidate['bib'] && candidate['bib']['title'];
                        return candidateTitle && candidateTitle.trim().toLowerCase() === expectedTitle;
                    });
                }
                if (publication && Number.isFinite(Number(publication['num_citations']))) {
                    element.textContent = ' · ' + Number(publication['num_citations']).toLocaleString() + ' citations';
                }
            });

            var scholarLink = document.querySelector('a[data-scholar-profile]');
            if (scholarLink && data['scholar_id']) {
                scholarLink.href = 'https://scholar.google.com/citations?user=' + encodeURIComponent(data['scholar_id']) + '&hl=en';
            }

            renderScholarCitationChart(document.getElementById('scholar_citation_chart'), data['cites_per_year']);

            var status = document.getElementById('scholar_metrics_status');
            if (status && data['updated']) {
                status.textContent = 'Updated ' + new Date(data['updated']).toLocaleDateString(undefined, {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
            }
        }).fail(function () {
            var status = document.getElementById('scholar_metrics_status');
            if (status) status.textContent = 'Citation data unavailable';
            var chart = document.getElementById('scholar_citation_chart');
            if (chart) chart.textContent = 'Waiting for the first Google Scholar sync.';
            console.warn('Google Scholar citation data is temporarily unavailable.');
        });
    });
</script>
